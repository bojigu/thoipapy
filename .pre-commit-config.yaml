# DataCatalysis coding style - run `pre-commit install` after cloning.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        # data/ is DVC-tracked, but the trained model is legitimately committed to git
        args: ["--maxkb=512"]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.13
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --allow-untyped-globals]
        # Covers the whole package. thoipapy/validation, thoipapy/feature_importance and
        # thoipapy/paper_figures were excluded for years as numpy- and matplotlib-heavy
        # unmaintained code, but the exclusion only ever held while nothing checked imported them:
        # a script that drives the pipeline imports thoipapy.run, mypy follows it, and the
        # findings reappear. Clearing them turned out to be five annotations, so the exclusion is
        # gone rather than worked around.
        #
        # Note when reading findings by hand: this hook installs mypy in its own environment,
        # without numpy or pandas, so their types resolve to Any here. Running mypy from the conda
        # environment sees the real stubs and reports far more, most of it mypy failing to track
        # ndarray/float. The hook is what CI enforces; that larger set is not.
        files: ^(thoipapy/(predict|artefacts|paths|run_settings|common|utils)\.py|thoipapy/(features|homologues|ML_model|clustering|experimental_data|validation|feature_importance|paper_figures)/.*\.py|scripts/.*\.py)$
