# DataCatalysis coding style - run `pre-commit install` after cloning.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        # data/ is DVC-tracked, but the trained model is legitimately committed to git
        args: ["--maxkb=512"]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.13
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --allow-untyped-globals]
        # Scoped to the prediction path and the shared modules, which are clean. thoipapy/validation,
        # thoipapy/feature_importance and thoipapy/paper_figures are excluded: they are numpy- and
        # matplotlib-heavy, are documented as unmaintained, and their remaining findings are almost
        # all mypy failing to track ndarray/float or reading stale third-party stubs (it reports
        # np.trapezoid and Bio.pairwise2.align.globalds as missing when both exist).
        files: ^(thoipapy/(predict|artefacts|paths|run_settings|common|utils)\.py|thoipapy/(features|homologues|ML_model|clustering|experimental_data)/.*\.py|scripts/.*\.py)$
